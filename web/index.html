<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-visual：键盘弹出时只缩视觉视口，布局视口保持满屏。
         默认若是 resizes-content（旧 Chromium / 部分 WebView 浏览器），布局视口会当场缩小，
         画布跟着缩，键盘还没滑上来之前那块空隙就由宿主窗口底色填充 —— 手机上表现为一闪的白块
         （实测 #F8FAFC，正是 manifest 的 background_color）。应用自己按视觉视口收缩 #root，
         所以这里显式锁死「不缩布局视口」。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
    <link rel="icon" type="image/svg+xml" href="<!--MINDFS_FAVICON_HREF-->" />
    <!--APP_SHELL_PWA_LINKS-->
    <meta name="theme-color" content="#f3f4f6" />
    <script>
      (function () {
        var key = "mindfs-appearance-mode";
        var mode = "system";
        try {
          var stored = window.localStorage && window.localStorage.getItem(key);
          if (stored === "dark" || stored === "light" || stored === "system" || stored === "meadow" || stored === "moss") {
            mode = stored;
          }
        } catch (_) {}

        if (mode === "dark" || mode === "light" || mode === "meadow" || mode === "moss") {
          document.documentElement.setAttribute("data-theme", mode);
        } else {
          document.documentElement.removeAttribute("data-theme");
        }

        var effective = mode;
        if (effective !== "dark" && effective !== "light" && effective !== "meadow" && effective !== "moss") {
          effective = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        var color = effective === "dark" ? "#0f172a" : effective === "meadow" ? "#f4efe6" : effective === "moss" ? "#dfe5d4" : "#f3f4f6";
        // 首帧就把窗口底色定下来：键盘弹出时 WebView 让出的区域露出的就是它。
        if (window.MindFSThemeBackground && window.MindFSThemeBackground.setBackgroundColor) {
          window.MindFSThemeBackground.setBackgroundColor(color);
        }
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i += 1) {
          metas[i].setAttribute("content", color);
          metas[i].removeAttribute("media");
        }
      })();
    </script>
    <!--APP_SHELL_PWA_META-->
    <title>MindFS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
