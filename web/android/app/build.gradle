apply plugin: 'com.android.application'

def mindfsGitVersion() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--always', '--dirty'
            standardOutput = stdout
            ignoreExitValue = true
        }
        def value = stdout.toString().trim()
        return value ?: 'dev'
    } catch (Exception ignored) {
        return 'dev'
    }
}

def mindfsVersionCodeFromName(String versionName) {
    // 必须接受三种形态：v0.5.5 / v0.5.5-1108（发布 tag）/ v0.5.5-1108-2-gabc1234（tag 之后的构建）。
    // 早先只认带 -g<sha> 的，于是 `make build-android VERSION=v0.5.5-1108` 落回 versionCode=1 ——
    // 应用内的自更新会永远认为「已是最新」。
    def matcher = (versionName ?: '') =~ /^v?(\d+)\.(\d+)\.(\d+)(?:-(\d+)(?:-\d+)?(?:-g[0-9a-f]+.*)?)?$/
    if (!matcher.matches()) {
        return 1
    }
    def major = matcher.group(1).toInteger()
    def minor = matcher.group(2).toInteger()
    def patch = matcher.group(3).toInteger()
    def build = matcher.group(4) ? matcher.group(4).toInteger() : 0
    // 分段宽度：build 10^4、patch 10^6、minor 10^8 ⇒ 可表示范围 major<21、minor<100、
    // patch<100、build<10000，最大约 2.1e9，正好落在 versionCode 的 Int32 里。
    // 改一边必须改另一边 —— 前端 web/src/services/update/appVersion.ts 的 nativeBuildCodeFromTag 是同一条公式。
    // 旧公式给 build 只留 10^3，而发布 tag 的构建号已经四位（v0.5.5-1115）：
    // 0.5.5-1115 算出 506116、0.5.6 只有 506001，安装器会把 0.5.6 当成【更旧的包】拒绝安装。
    // 新号码整体大于旧号码（0.5.5 = 5050001 对旧公式封顶约 510k），装着旧包的机器能直接升上来。
    if (major >= 21 || minor >= 100 || patch >= 100 || build >= 10000) {
        throw new GradleException("mindfsVersion '${versionName}' 超出 versionCode 可表示范围（major<21, minor<100, patch<100, build<10000）")
    }
    return Math.max(1, major * 100000000 + minor * 1000000 + patch * 10000 + build + 1)
}

def mindfsVersionName = (
    findProperty('mindfsVersion') ?:
    System.getenv('VERSION') ?:
    mindfsGitVersion()
).toString().trim()
def mindfsVersionCode = (
    findProperty('mindfsVersionCode') ?:
    System.getenv('ANDROID_VERSION_CODE') ?:
    mindfsVersionCodeFromName(mindfsVersionName)
).toString().toInteger()

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def signingStoreFile = keystoreProperties.getProperty("storeFile") ?: System.getenv("ANDROID_KEYSTORE_FILE")
def signingStorePassword = keystoreProperties.getProperty("storePassword") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
def signingKeyAlias = keystoreProperties.getProperty("keyAlias") ?: System.getenv("ANDROID_KEY_ALIAS")
def signingKeyPassword = keystoreProperties.getProperty("keyPassword") ?: System.getenv("ANDROID_KEY_PASSWORD")

def isReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
if (isReleaseTask && !(signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword)) {
    throw new GradleException("Missing Android signing config. Set android/keystore.properties or ANDROID_KEYSTORE_* env vars (see docs/android-build.md).")
}

android {
    namespace = "com.mindfs.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mindfs.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode mindfsVersionCode
        versionName mindfsVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingStoreFile) {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "androidx.webkit:webkit:1.12.1"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
