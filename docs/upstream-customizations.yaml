  - id: G-AX
    title: relay 绑定轮询测试的两条同步竞态
    kind: fix
    symptom: |
      TestManagerPollTerminalBindStatusStopsPolling 偶发失败：
      ① "pending code did not clear after expired bind status"，耗时正好 5.00s
      （撞上 time.After(5 * time.Second)）；
      ② "expected initial pending code"（-race -count=20 实测复现）。
      单独跑 30/30 全绿，所以极易被当成「偶发、不管它」。
    why: |
      两条互相独立的竞态，都是「静默退化」型 —— 测试全绿、短跑看不出问题：
      ① 状态落地晚于 channel 发送。本文件的 mock transport 在返回响应**之前**
      就把 URL 送进 requests，而 poller 要等响应返回之后才走 onFinished 更新
      Status()（manager.go 的 pollLoop：m.pendingCode = ""; m.lastError = status）。
      原实现从 requests 读到请求就**立刻**查 Status()，不是 "expired" 就 continue
      去读下一个请求 —— 而 poller 收到 expired 之后已经 return 了，再没有下一个
      请求，于是卡到 5s 超时。
      ② channel 带缓冲（cap 4）导致 poller 抢跑。缓冲让发送不阻塞，poller 会抢在
      测试观察之前跑完整个 poll（expired → onFinished → 清空 PendingCode），
      于是 StartBinding() 返回后立刻查 PendingCode 可能是空的。
    boundary: |
      收到请求后必须等状态落地（轮询 Status()），不得读一次就 continue；
      requests 必须无缓冲；顺序假设必须被确定性复现。
    tests:
      - web/tests/relay-bind-poll-sync.test.mjs
    files:
      - server/internal/relay/service_test.go

