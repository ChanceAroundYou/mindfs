  - id: G-BG
    title: 会话窗口读不整表解析（冷开窗按需读 + tail 增量三处缺陷 + 搜索 cap + O1 两条全量 aux 热路径）
    kind: fix
    symptom: "① 打开/切换会话时整个 root 停顿（冷缓存开窗走 readExchangesFull，解析整份主日志且持 m.mu）；② 同 seq 的后续版本读不到，页面继续显示旧内容；③ tail 内同 seq 重复吐；④ 完整性升级被误报成冲突；⑤ 含超长行的会话整个搜不到；⑥ 列表页对每个命令会话全量读 aux；⑦ 非窗口化的 sync 全量读 aux 再过滤。"
    why: "会话窗口读必须 O(窗口) 或 O(尾部命中)：冷缓存改走 readExchangeWindow（读盘一次 → 字节级行计数拿 Total → 只解析尾部 need+1 条）；readExchangeTail 去掉 seq<=baseSeq 跳过，同 seq 去重交给 mergeExchangeRecords（空内容永不覆盖非空内容）；搜索上限对齐 maxExchangeLineBytes；新增 Manager.GetCommandShell 有界读；handleSessionSync 改为与 handleSessionGet 同构。尾部读刻意不复用 readAuxWindowTail 的逐块反向读 —— 那个实现会丢掉每个分块的首条半行。"
    boundary: "会话窗口读（GET /api/sessions/{key}?latest= / ?before_seq=、窗口化 sync）与列表页的 shell 标签推断，必须 O(窗口) 或 O(尾部命中)，不得整表解析、不得全量读 aux。实时写路径、Full 同步、import、repoint、子代理同步都不动。"
