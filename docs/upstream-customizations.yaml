  # ── 看板：任务卡的按钮语义 ──────────────────────────────────────
  - id: G-AP
    title: worktree 收尾按钮重做（机械优先 + 四分支分流 + 幂等 + 真实状态）
    kind: fix
    symptom: |
      收尾按钮一直转、点不动、也结束不了：agent 那半已经合完、只差机械清场时，
      后端无条件调 BeginFinishWorktree 撞「该任务已在收尾流程中」409，前端把按钮换成转圈，
      用户唯一的出路被藏起来。worktree 目录已被删（wt-finish cleanup / 手工 rm）的卡片
      仍显示绿色「已开启 worktree」，界面谎称「有树」。

      2026-10-07 重做后的新症状：① 收尾段跑完却留下一个空壳目录 —— `git worktree remove`
      只删 git 登记的那个树，目录里 git 不跟踪的 .mindfs/ .omc/ .claude/ 让它拒绝，
      .worktree/ 越积越多，用户得手工 rm。② 用户在 worktree 会话里传的附件跟着目录一起消失
      （落在 <worktree>/.mindfs/upload/，拆目录前没人搬）。③ 明明 worktree 干净、合并无冲突，
      却还要白等一轮 agent、多一个空提交。④ 重复点收尾第二次报红色失败
      （「该任务还没有 worktree」），而第一次明明成功了。

      2026-10-08 第三轮的新症状：重启服务后点 task-37 的收尾，拿到 409
      「主 checkout 有未提交改动，先提交或暂存后再收尾」+「合并会覆盖这些改动，
      git 不敢替你决定丢不丢。处理完再点一次收尾即可。」，涉及两个未跟踪的
      e2e 探针脚本。用户原话：「不应该报错，而是应该把 comment 提交给 agent，
      进入 agent 合并流程」。
    why: |
      三条判据（用户 2026-10-05 拍板）：① 按钮给法只看 worktree 的真实状态
      （create_worktree 且目录存在），与任务状态无关；② 点击行为四分支且全部幂等
      （会话在回复→200 session_running / 分支已合进主干→当场机械清场 / 已有收尾段→重跑 /
      其余→追加收尾段）；③ 徽标以「目录是否存在」为金标准。
      会话运行状态是金标准（不是 task.Status）—— 任务可以长时间停在 running 却早就没 agent 了，
      旧判据下那种任务永远收不了尾。探针由 api 层装配时挂上，没装配时回落旧状态判据。
      收尾中的视觉信号是文字不是动效（2026-10-07 用户要求）：绿色标签文字变「收尾中」
      （task.worktreeFinishingLabel），不加脉冲动画；TaskDetailPanel 里那条转圈横幅一并删掉。
      按钮全程可点，区分 enabled 与 finishing 的唯一信号就是标签文字。

      2026-10-07 第二轮（用户拍板）：**机械优先** —— 先做一次只读判定
      （PlanFinishWorktree + gitview.CanMergeCleanly 用 `git merge-tree --write-tree` 干跑），
      能机械清场就直接做掉，不等 agent。判据只有两条：worktree 里没有未提交的改动、
      合并不会冲突。**主 checkout 干不干净刻意不参与判定**（用户：「只要机械合并能成就行」）——
      真不干净时 MergeBranch 自己拦下并列出文件，提前拦只会把「主 checkout 有改动」
      误报成「要跑 agent」，白等一轮问题还在。
      不能机械清场时（有未提交的活 / 合并会冲突）才走 agent，且把 reason + files 回给前端
      说清楚为什么。
      **拆目录前必须搬附件**（MigrateWorktreeUploads）：只搬 .mindfs/upload/，主 checkout
      已有同名文件时不覆盖（那份是权威的）。
      **目录本体整个删**（RemoveWorktreeDir，用户：「强删 rm -rf」）：git 拆完之后目录里
      只剩工具状态目录，留着只会越积越多。但**别人的**孤儿目录仍然只列不删 ——
      RemoveToolStateOnlyOrphanDirs 只删「里面只剩 .mindfs/ .omc/ .claude/」的空壳，
      含用户文件的目录绝不自动删（wt-finish.sh 有同一个 guard）。
      **幂等**：重复点击第二次必须 200 且带一句 note 说明「已经收过尾、本次没有可清场的活」，
      不能报红色失败。幂等刻意放在 api 层编排（FinishWorktreeAndRepoint）而不是下层
      FinishTaskWorktree —— 下层对空路径保持严格报错，那是为了守住「先清归属再拆目录」
      的顺序不变量（路径空 + 目录还在 = 顺序反了，静默成功会把它藏起来）。

      2026-10-08 第三轮（用户实测）：① MergeBranch 的「已是祖先就短路」排在脏检查
       **之后** —— 没有东西要合时主 checkout 脏不脏完全无关，排在后面就让「分支早就
       合完了、只差拆目录」这种最常见的收尾被一个不相干的改动挡死。② 脏检查把未跟踪
       文件也算进来，过宽：合并只在要写同名路径时才碰得到它，那一刻 git 自己会拦
       （untracked working tree files would be overwritten by merge），git checkout 也一样
       会拦（两条命令都没带 -f）。收窄成 trackedDirtyPaths。③ **机械清场失败不再报错，
       落回 agent**（agentFallbackPlan）：机械那条路是加速段不是门槛，判定说能做、执行时
       被挡下时结论是「让 agent 去做」而不是「收尾失败」。只有没有 agent 段可继承时才回
       409 + 结构化清单，并把 agent_error 一并带出。顺带修掉 porcelain 解析 bug：
       strings.Index(line, " ") 在状态带前导空格时（` M foo`）切出带状态前缀的假路径。

      2026-10-08 第四轮（用户实测 task-9「日程管理 / 组件库」）：点收尾拿到巨长的 409
       —— 标题「合并已成功，但 worktree 里还有没提交的东西」+ 12 个文件清单。用户原话
       「不应该给我报错，而是应该去插入 comment prompt 给 ai 去执行」。三件事叠在一起：
       ① 分支已合进主干（merge 在 21:41）；② worktree 里还有 12 个文件 161 增 115 删
       （23:30–00:41 做的），根本没进主干；③ 当前段是 **agent 段的 waiting_user**。
       三处修：① **PlanFinishWorktree 判定顺序反了** —— 「分支已在主干 → 机械」排在
       「worktree 里还有没提交的活」前面。分支合过不等于树里没活，拆目录不可逆，脏检查
       必须排前面。② **收尾段追加不进去** —— AddStage 走的是评论那条规则
       （canAdvanceFromStage），agent 段的 waiting_user 在它那里明确拒绝；而仓库里早有
       正确规则 canLeaveStageOnRequest（「要放行只有用户手动点」，「下一段」按钮用的就是
       它）。新增 AddStageInput.ByRequest，收尾置位走那条；不置位时评论仍越不过。
       ③ **两条路都断时报错了对象** —— 响应里塞的是机械清场的报告（user_changes = 12 个
       文件），前端按「哪个清单非空」挑弹窗，渲染成一长串清单，而真正的拦路虎在 agent
       那条。现在主 error 用 agent 那条，机械那份只留在 report 里当上下文，文件清单
       **不提到顶层**。顺带删掉上一轮的 agent_error / note 管道（只有一个产出点，主 error
       换成 agent 那条之后它永远等于 error，成了死代码）。
