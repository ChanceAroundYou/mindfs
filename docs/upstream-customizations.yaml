  # ── 性能：列表投影与条件请求 ────────────────────────────────────
  - id: G-AN
    title: 列表投影瘦身与条件请求（ETag / 304）
    kind: perf
    symptom: |
      列表刷新整份重传：会话列表 149KB、跨项目看板 163KB，其中「恒为空」的键占四分之一强，
      看板卡片里 43% 的 `stages` 前端从来不读；空闲时反复拉同一份列表也拿不到 304，
      上行请求数与首字节时间白涨（实测 8 文件场景 `related-file/diff` 请求 160 次 → 0 次）。
    why: |
      列表接口是最高频的请求，改为服务端按请求现算投影 + ETag：
      `respondJSONList` 统一做两件事 —— 省略**恒为空**的键（`toSessionItem` 对每个被省略的键
      都有防御性兜底）、按内容算 ETag 并支持 `If-None-Match` 回 304
      （实测单条记录 1052B → 372B，会话列表 149KB → 85KB）。
      跨项目看板 `GET /api/tasks/overview` 丢掉卡片从不读取的 `stages` / `prompt_template`
      （`task.stages.prompt_template` 一项就占 14.4%）。
      **但这张投影表不是「只留 id」**：`create_worktree` / `worktree_path` / `worktree_built` /
      `worktree_missing` 四个字段必须留 —— 卡片上的 worktree 徽标就靠它们推（`TaskCardRows`
      的 `worktreeTagState`）。2026-10-07 实测「工作台所有任务都显示没有 worktree」就是投影
      把它们丢了，而当时的代码注释还断言「工作台对 worktree_* 一个读取都没有」，是错的。
      加字段时同步看 `http_tasks_overview_test.go` 的第 ③/④ 段：③ 列的是必须丢的，
      ④ 列的是必须留的 —— 往③里塞 worktree 字段就是把这个 bug 写回去。
      详情类端点（agents / task-templates / git status / tree / 看板 tasks / replying-sessions）
      走 `respondJSONConditional`：**只协商、不瘦身** —— 它们的 `dirty_count: 0`、空数组、
      `stages`/`events` 流水都是承重信息，删键即静默丢数据（看板详情面板直接读列表项里的
      `task.stages`）。两者共用 `writeJSONWithETag`，否则改一处漏一处。
      `stripEmptyJSONValues` 返回副本而非原地删键 —— 原先「必须传本请求现造的结构」只是注释里的契约。
      客户端 `services/api.ts` **必须先判 304 再判 `response.ok`** —— 304 的 `ok` 是 false，
      顺序写反会把命中缓存的响应当成失败；缓存上限 16 → 64 是因为带 ETag 的端点从 3 个变成 10 个。
      **单会话详情 `/api/sessions/{key}` 也接上了协商**：它是全站最重的端点，窗口化尾部拉取
      （`?latest=20`）单次 1.14 MB，客户端 ~1.7 秒轮询一次，实测 60 分钟 4,746 次 ≈ 1.1 GB/h、
      占全部请求的 70%（会话没在跑时回包逐字节相同）。只协商不瘦身：`exchanges` / `window_meta`
      少一个键就是少一段对话，且 `seq` 增量的判据会被删空键破坏。
      条目数管不住内存（一条就是 1.14 MB），故另加字节预算 `conditionalRequestBytesMax`
      （6 MB），字节数用原始文本长度记账（`Content-Length` 因 chunked 拿不到）；
      淘汰同时看条数与字节，且 ETag 与载荷必须同生共死，否则留下「304 但拿不出内容」的悬空条目。
    files:
      - server/internal/api/helpers.go
      - server/internal/api/http.go
      - server/internal/api/http_tasks.go
      - web/src/services/net/api.ts
    tests:
      - server/internal/api/helpers_jsonlist_test.go
      - server/internal/api/http_tasks_overview_test.go
      - web/tests/conditional-request.test.mjs
      - web/tests/session-list-node-failure.test.mjs
    anchors:
      - server/internal/api/helpers.go:func respondJSONList
      - server/internal/api/helpers.go:func respondJSONConditional
      - server/internal/api/http.go:respondJSONConditional
      - server/internal/api/http_tasks.go:func projectOverviewTask
      - web/src/services/net/api.ts:304
      - web/src/services/net/api.ts:conditionalRequestBytesMax
      - web/src/services/net/api.ts:rememberConditionalResponse

  # ── 可观测性：自动重载 ──────────────────────────────────────────
  - id: G-AO
    title: 自动重载观测（只记录不干预）
    kind: arch
    symptom: |
      标签页反复崩溃 / 自动重载，但没有任何一条现场证据说明重载来自哪里 ——
      已排除 staleAssetRecovery 成环（它按 sessionStorage 保证同一资源只重载一次），
      剩下的候选（有代码在主动 reload / 标签页被 OOM 杀掉后用户重进）无法从日志区分，
      于是只能按猜测逐项优化，改错了也没有反馈。
    why: |
      `web/src/main.tsx` 最早一行调用 `installReloadObserver()`，把现场证据写进 sessionStorage：
      本次加载的 `navType`（reload / navigate）与累加的 `loads`、`performance.memory` 峰值
      （每 30s 采样，仅 Chromium）、本轮第一条 error / unhandledrejection 的截断消息。
      读法：控制台 `__mindfsReloadReport()`。**只记录不干预** —— 这是测量，不是修复。
      观测器自己必须有界（采样上限 10 条、错误文本截断 200 字符、关标签页即清），
      否则就成了 G-AH 修过的那类无界增长源；存储不可用（隐私模式）时静默降级、绝不抛。
    files:
      - web/src/services/platform/reloadObserver.ts
      - web/src/main.tsx
    tests:
      - web/tests/reload-observer.test.mjs
    anchors:
      - web/src/services/platform/reloadObserver.ts:installReloadObserver
      - web/src/main.tsx:installReloadObserver

