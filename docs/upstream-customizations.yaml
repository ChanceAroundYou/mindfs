  - id: G-T
    title: 流式重放与正文正确性
    kind: fix
    symptom: |
      同一段正文在行内被拼成 aabb（「文本出现两遍、越切越多」）；
      每切一次会话就刷一大堆重放；首次打开运行中会话时内容逐渐刷出来；
      切回运行中会话时在途内容整块丢失；
      长回答**静默丢字**（2026-10-06 实测：300KB 的回答丢 50 字节、800KB 丢 13 片），
      且流式期间整页卡顿 —— 拼接扫整段累积正文，300KB 要 2 秒主线程。
    why: |
      重放必须幂等（整段重放→覆盖、重复分片→忽略），三处拼接收敛到 mergeStreamedText 一个定义；
      光标是「我已收到 X」的凭证，不能清；重放整批一条 WS 消息下发（几百条单帧=几百次渲染）；
      加载时组装只能有一条规则 composeLoadedExchanges（瞬时行 seq=0 只在在途时保留）；
      seq=0 必须有清理出口 dropTransientExchanges，否则跨 compact 堆积到上千条。
      mergeStreamedText 的重复分片判断**只扫尾窗**：重复分片只可能是服务端重推的刚追加过的尾部，
      对整段做 a.includes(b) 会把中段碰巧撞上的同样字符串当成重复而丢掉正文（正是上面「丢字」的症状），
      同时每个分片都要压平整段 rope，是 O(n²)。尾窗同时修对错和性能。
    files:
