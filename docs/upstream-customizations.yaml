  - id: G-X
    title: 置顶（pins）—— 控制面权威 + 每账户一份
    kind: feature
    symptom: |
      在 PC 的项目里置顶没反应；置顶刷新后就没了（前端自己拼键，与服务端分叉）；
      worker 节点列表永远没有置顶区。
