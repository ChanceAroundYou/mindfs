  - id: G-BI
    title: 会话身份收敛为两套 id（mindfs_id + agent_id，NativeTurn/NativePrompt/NativeID 合并）
    kind: arch
    symptom: "系统里出现第三套 id：turn_id（MindFS 铸的、落盘）、native_turn/native_prompt（agent 回查键）、pending 灯另算一套 TurnGen，而 ACP 与 claude 各自带回的 messageId / uuid 又无处安放 —— 「同一个回合叫什么」这个问题在四处各有答案。更实际的故障：导入路径根本不铸 turn_id，导入行与实时行只能靠「内容相似 + ±5 秒」猜，实测 9 对重复行。"
    why: "全系统只留两类 id：mindfs_id（MindFS 在写入点统一铸，系统内唯一、不变，是实际使用的那个）与 agent_id（agent 返回的，claude 转录 uuid / ACP messageId，格式随 agent 而异，只作桥梁）。判定顺序：先 agent_id 再 mindfs_id，两层都对不上才退到「内容 + ±5s」。mindfs_id 由 NewMindFSID(agentID, fallbackSeed) 确定性派生 UUIDv5，于是同一轮的 live 与 import 两侧铸出同一个 id，导入侧不再需要伪造 turn_seq 对齐。NativeTurn / NativePrompt / NativeID 三字段合并成一个 AgentID（它们本来就是「agent 侧回查键」这一个概念，拆三个只会让判重口径分叉）。兼容性走 UnmarshalJSON 而不是散布 json.RawMessage —— 键名一旦写进盘，改名就必须留读路径，否则历史会话全部读成「没有身份」。pending 不再独立 mint user turn id，只接收 persistUserTurnExchange 返回的 canonical mindfs_id。"
    boundary: "会话轮次元数据的字段名与铸造规则：Exchange.AgentID、Block.AgentID、NewMindFSID、exchangeAgentKey / exchangeIdentityRecorded、stream_hub 待亮灯身份。用户行身份按 Manager 实际分配的 seq 铸造并复用到 pending。块流正文格式未变；写入侧身份判重由本组提供，读时内容投影已于 2026-10-12 由 G-AB 退役。"
