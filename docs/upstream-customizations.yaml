  - id: G-AU
    title: 会话拉取风暴与渲染主线程阻塞
    kind: fix
    symptom: |
      界面莫名其妙卡死、标签页崩溃。实测（journalctl -u mindfs，2026-10-06 17:33 →
      10-07 08:29，持续 18 小时）：GET /api/sessions/1791268544-ef85840083c5?... 返回
      404，22–25 次/秒，单小时 5232 次，累计 7800+ 次，且在 mindfs 与 日程管理
      两个 root 之间交替。浏览器每域只有 6 条连接，这个循环把它们全占满 →
      会话列表 / 文件 / WS 重连全部排队 → 界面卡死 → 标签页被杀 → 自动重载
      （对应访问日志里成对的页面加载 burst）。
    why: |
      两段缺一不可，且都是「静默退化」型 —— 测试全绿、短会话看不出问题：
      ① 加载 effect（web/src/App.tsx）的依赖里有 selectedSessionSnapshot 这个**对象**，
      而它的身份随 cacheVersion 每次 bump 都变（getSessionSnapshot 的 dep 数组含
      cacheVersion）；流式输出每 30ms bump 一次，每个 tool_call / todo_update /
      plan_update 还会同步再 bump 一次 → effect 每轮都重跑。
      ② loadedSessionRef 只在**成功**时置位，404 的会话永远兜不住 → 没有终点。
      于是「选中一个拉不到的会话」+「有 agent 在流式输出」同时成立时，
      拉取风暴自持下去。
      另外三条放大单次渲染成本：timeline.slice(0, idx+1).filter(...) 与
      previousUserTimestamp 反向扫描都是 O(n²)；滚动处理每个 scroll 事件都跑
      querySelectorAll + 逐个 getBoundingClientRect + setState，无节流；
      sessionCacheRef 无上限（IDB 那份有 500 条 / 200KB），长时间浏览堆到几百 MB。
    boundary: |
      加载 effect 的依赖只能是身份（键 / 根 / 布尔），不能是快照对象；
      拉取失败必须留痕且 404 是终点；sessionCacheRef 必须有上限；
      渲染路径不能有 O(n²)，滚动必须节流。
    tests:
      - web/tests/session-load-storm.test.mjs
    files:
      - web/src/App.tsx
      - web/src/components/session/SessionViewer.tsx
