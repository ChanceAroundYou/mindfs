  - id: G-IX
    title: 排队卡/会话尾遮挡与 assistant 复制透传
    kind: fix
    symptom: "排队消息卡的 ✎/删除/立即发送按钮下半被输入条盖住；滚到底时最后一条 user 消息的复制等按钮被悬浮输入条挡住半颗；assistant 消息点复制完全没反应。"
    why: "排队列表底只留 4px 间隙，28px 按钮下沿掉进输入条上沿；会话内容区底留白写死、未用 composerOverlayInset 派生且缺 scroll-padding-bottom；Timeline 分叉处 Assistant 缺 6 个 copy props，点击同步抛 TypeError 且无反馈。"
    boundary: "只改三处：排队列表底间隙 4px→8px；会话内容底留白与滚动 scroll-padding 由 composerOverlayInset 派生；Timeline 给 Assistant 补齐 copy props。不动 composer 高、不动按钮尺寸、不改 clipboard 链。"
