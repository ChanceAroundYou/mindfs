  - id: G-BI
    title: 回合身份收敛为两个 id（turn_id/native_* → mindfs_id/agent_id）
    kind: arch
    symptom: "同一轮在同一条读路径上有三种身份表示：主日志写 turn_id，pending 灯记 TurnGen，块流带 native_id。四种 legacy 键名（turn_id / native_turn / native_prompt / native_id）在不同入口各写一两种，于是「同一回合的两次写入」无法用同一把尺子判定。用户侧症状：用户回声与助手回复去重漏判/误判，实时流与读取结果对不上账。"
    why: "全系统只剩两类 id：MindFSID（mindfs_id，MindFS 铸、落盘即定、永不改、系统内唯一）与 AgentID（agent_id，agent 侧桥梁键，可空可后补，不参与唯一性）。无 agent id 时由 NewMindFSID 确定性派生 UUIDv5 —— 判重因此可复现。Exchange / Block 各加 UnmarshalJSON 兼容层：没有这层，存量会话读出来身份全空，已回填的块与轮次脱钩，用户历史正文当场消失。前端 overlay 改为按（角色类别、mindfs_id）对账，显式不按正文相似度 —— 相似度对「同一个 user prompt 出现两次」无能为力，而那正是它想拦的重复；无身份的帧保留而不是猜它的归属。删除 latestSeq 水位线：身份收敛之后「哪一行是新的」由 mindfs_id 决定，水位线只会让晚到的帧被静默丢弃。"
    boundary: "身份字段的命名、派生与读取兼容；前端 overlay 的对账口径。不改块流存储格式、不改判重的优先级顺序（AgentID > MindFSID > 内容兜底）。"
