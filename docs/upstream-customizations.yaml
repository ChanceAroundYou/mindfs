  - id: G-AU
    title: 会话拉取风暴与渲染主线程阻塞
    kind: fix
    symptom: "界面莫名其妙卡死、标签页崩溃。实测（持续 18 小时）：某个会话 GET 返回 404，22–25 次/秒、累计 7800+ 次，浏览器每域只有 6 条连接被全占满 → 会话列表/文件/WS 重连全部排队 → 界面卡死 → 标签页被杀 → 自动重载。"
    why: "两段缺一不可，且都是静默退化型（测试全绿、短会话看不出）：① 加载 effect 的依赖里有 selectedSessionSnapshot 这个对象，而它的身份随 cacheVersion 每次 bump 都变（流式输出每 30ms bump 一次）→ effect 每轮都重跑；② loadedSessionRef 只在成功时置位，404 的会话永远兜不住 → 没有终点。另外三条放大单次渲染成本：timeline 切片与反向扫描都是 O(n²)；滚动处理每个事件都跑 querySelectorAll + getBoundingClientRect 且无节流；sessionCacheRef 无上限（IDB 那份有 500 条/200KB）。"
    boundary: "加载 effect 的依赖只能是身份（键/根/布尔），不能是快照对象；拉取失败必须留痕且 404 是终点；sessionCacheRef 必须有上限；渲染路径不能有 O(n²)，滚动必须节流。"
