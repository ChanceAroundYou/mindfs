  - id: G-AK
    title: 本地化（中英双语键）
    kind: feature
    symptom: |
      界面出现裸 key（如 tasks.stage.approve）而不是文案；中英文两侧键不对称；
      长会话里逐条渲染卡一下 —— Intl 格式化器每次调用都重新构造
      （实测一次渲染 1000 条消息要 235ms，缓存后 14ms）。
    why: |
      本地新增的多账户/看板/工作台/节点等键必须与上游键并存，
      合上游时两侧 i18n 文件是最容易被整文件覆盖的。
      index.tsx 的格式化器缓存同理：上游 i18n/index.tsx 一旦整份覆盖，
      缓存会**静默**消失 —— 测试全绿、肉眼也看不出，只有长会话才卡一下。
    files:
      - web/src/i18n/locales/en-US.ts
      - web/src/i18n/locales/zh-CN.ts
      - web/src/i18n/index.tsx
    tests:
      - web/tests/task-panel-unification.test.mjs
      - web/tests/intl-formatter-cache.test.mjs
    # 键集一致性由 tsc 兜（en-US 的类型是 Record<MessageKey, string>，MessageKey = keyof typeof zhCN），
    # 合上游 SOP 里本来就跑 tsc --noEmit，再写一个键奇偶测试只是重复。
    # 锚点改钉「fork 独有键还在不在」—— 这是 tsc 查不出的方向（整份 zh-CN 被上游版覆盖时，
    # 少的是我们的键，不是上游的键）。
    anchors:
      - web/src/i18n/locales/zh-CN.ts:"account.primary"
      - web/src/i18n/locales/en-US.ts:"account.primary"

