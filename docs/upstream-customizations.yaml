  - id: G-BK
    title: 发送前落盘所选模型（回合内模型切换 + 内部别名拒收）
    kind: fix
    symptom: "模型是 set 会话元数据，不是回合的结果。原先它只在 OnStart 之后才被 reconciled 回写：流式期间任意一次列表/窗口刷新都会拿回旧模型，用户正在打的这轮用的是新模型、页面显示旧模型。另一侧：agent 的内部别名（如 sonnet/opus 这类聚合假名）会被当成合法 model 写进去，运行时才发现不支持，而此时 user 行已经落盘 —— 留下一条用户没等到任何回复的孤立消息。"
    why: "选中的模型在 user 行落盘与 OnStart 之前 UpdateModel 落库：流式期间的刷新读到的就是本轮真正在跑的模型。运行时实际模型仍可能被 agent 规范化（canonicalize），那在本轮收尾时按 LiveModel 收敛，不是这里的职责。不支持模型的校验必须抢在 user 行落盘之前 —— 本轮压根不会开始，user 行也就没有存在过；顺序反了就是孤立消息。内部别名只在后端拒收（前端仍可展示成组模型名，见 G-R），拒绝边界放 validateAgentModel。"
    boundary: "何时落盘模型、校验的先后顺序。不改模型识别与显示假名那半（G-R）。"
    tests:
      - server/internal/api/usecase/session_model_switch_test.go
    files:
      - server/internal/api/usecase/session.go
      - server/internal/api/usecase/session_send.go
    anchors:
      - server/internal/api/usecase/session_model_validation.go:validateAgentModel
      - server/internal/api/usecase/session_send.go:UpdateModel

