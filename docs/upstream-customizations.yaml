# MindFS fork 定制注册表（机器真相）
#
# AGENTS.md「fork 定制与上游合并（必守）」那条铁律的可核对面，**唯一**的核对清单
# （2026-10-16 删掉了并行的叙述版 md，组 id 对齐断言随之退役）。
#
# files 的匹配语义（只有两种，Go 的 path.Match 不支持 **）：
#   - 结尾带 /  → 目录前缀匹配，如 server/internal/kanban/
#   - 含 *      → path.Match 单段通配
#   - 其它      → 精确路径
#
# 注意：本表是**文件级**的（hunk 级的「组间互斥」做不到）——同一个文件（App.tsx /
# http.go / manager.go）的定制 hunk 分散在多个组里很正常，因此一个文件可以出现在多个组。
# 断言 2 只保证「这个文件仍与上游有差异」，逐条覆盖由每组的 tests 承担。
#
# 维护：新增定制 → 先在 files 里登记（否则断言 1 报未覆盖），再补 tests 与 anchors，
# 跑 `go run ./scripts/check-upstream` 到全绿，提交信息标 `Scope: G-xx`。

