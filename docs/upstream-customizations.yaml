    title: 会话模型选择与运行态一致性
    kind: fix
    symptom: "上一轮使用模型 A，用户在选择器切到模型 B 并发送后，回复期间选择器仍显示 A，直到整轮完成才更新；已有运行实例也可能被旧 session 快照误判为当前模型。"
    why: "被选择的模型属于会话状态，SendMessage 必须在持久化用户消息和触发 OnStart 前保存它，让流式期间的刷新读到新选择。已有 agent 运行实例的 CurrentModel 是活进程状态；只有 runtime 没有可用模型时才依次回退到最新 exchange 与 session 快照。轮次完成后再将 runtime 解析出的最终模型写回，保留 agent 规范化模型名的结果。这与 G-R 的 provider 模型识别、别名探测和模型名流式透传是独立的定制边界。"
    boundary: "会话选择模型的持久化时序，以及活跃 runtime、exchange、session 快照之间的权威优先级。不扩展 provider 探测、别名识别或 stream model_display_name 透传。"
