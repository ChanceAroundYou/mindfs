  - id: G-BK
    title: 发送前落盘所选模型（回合内模型切换 + 内部别名拒收）
    kind: fix
    symptom: |
      模型是 set 会话元数据，不是回合的**结果**。原先它只在 OnStart 之后才被 reconciled
      回写：流式期间任意一次列表/窗口刷新都会拿回旧模型，用户正在打的这轮用的是新模型、
      页面显示旧模型，回合一结束又跳成新模型。另一侧：agent 的内部别名（如
      `sonnet`/`opus` 这类聚合假名）会被当成合法 model 写进去，运行时才发现不支持，
      而此时 user 行**已经落盘** —— 留下一条用户没等到任何回复的孤立消息。
    why: |
      1) 选中的模型在 user 行落盘与 OnStart **之前** UpdateModel 落库：流式期间的刷新
         读到的就是本轮真正在跑的模型。运行时实际模型仍可能被 agent 规范化（canonicalize），
         那在本轮收尾时按 LiveModel 收敛，不是这里的职责。
      2) 不支持模型的校验必须**抢在 user 行落盘之前**：本轮压根不会开始，user 行也就
         没有存在过。顺序反了就是孤立消息。
      3) 内部别名只在后端拒收（前端仍可展示成组模型名，见 G-R）；拒绝边界放
         validateAgentModel，与 G-R 的 [1m] 兼容判定同一条路径。
    boundary: |
      何时落盘模型、校验的先后顺序。不改模型识别与显示假名那半（G-R）。
    tests:
      - server/internal/api/usecase/session_model_switch_test.go
    files:
      - server/internal/api/usecase/session.go
      - server/internal/api/usecase/session_send.go
    anchors:
      - server/internal/api/usecase/session.go:validateAgentModel
      - server/internal/api/usecase/session_send.go:UpdateModel

  - id: G-BL
    title: 看板新建任务的 worktree 节点路由
    kind: fix
    symptom: |
      从工作台为远端 Git 项目新建任务时，worktree 开关和分支选择器消失；同名项目可能按
      另一节点的 Git 状态判断，并把分支请求或任务创建发到错误节点。项目看板初始加载也
      可能用同名项目的回退记录判断 Git 状态。
    why: |
      多节点的 rootId 不是唯一身份。工作台回调虽收到 nodeId，旧路径却只传 rootId；面板
      再从 byId 的首个同名项目读取 is_git_repo。以 nodeId::rootId 贯穿项目选择、Git 元数据
      判断、分支查询、偏好存储、附件上传、任务创建与 worktree 刷新；显式节点找不到元数据
      时不得退回另一节点的同名记录。
    boundary: |
      仅看板新建任务的项目身份路由与 worktree 选择/创建链路。已有任务执行、收尾和 worktree
      生命周期策略不变。
