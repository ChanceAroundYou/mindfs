  - id: G-BE
    title: pending 的回合身份与单一终结器（迟到 done 不误抹新轮 + 终态边必达）
    kind: fix
    symptom: "「完成回答但还显示正在思考」（灯不灭）与「正在运行但会话列表灯不亮」（灯不亮）两个相反症状并存。"
    why: "根因不是超时，而是 pending 条目没有回合身份：灯不亮 —— 第 A 轮迟到的 session.done 落地时 ClearSessionPending 无条件删条目，把第 B 轮刚开始的灯抹掉；灯不灭 —— 子会话只有 MessageDone 一条清理边，error/取消/父轮先结束都会让 pending 永久残留。改法：SessionPendingState 带回合身份（G-BH/S2e 起是 turn_id），ClearSessionPending 只在两侧都有身份且一致时才清；抽出唯一终结器 AppContext.EndSessionTurn，所有终态边都走它并用 defer 覆盖成功/出错/取消/panic。这套身份比对机制项目里本就有（ActiveTurnID 用于取消定位），pending 缺的不是新机制，是把同一份纪律用上去。"
    boundary: "服务端 pending 条目的身份与生命周期：谁有权清理、迟到/重复 done 的处置、子会话 pending 的终态收边。不做静态判死/超时（已于 G-AY 证伪）。"
