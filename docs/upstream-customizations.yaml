  - id: G-AQ
    title: 任务卡的三把键：完成兜底 / 取消 / 删除
    kind: feature
    symptom: |
      ① 已收尾的卡片挂着一个点不动的黄色循环键（重建 worktree）—— 重建只在目录已不在时出现，
      而目录不在就等于已收尾，收完尾的任务既没有树可执行也没有树可拆，「重建恢复后再执行」
      是一句兑现不了的承诺。② 任务卡在待审核、界面上没有任何出路：指针停在收尾段、
      那一段卡在待审核，而 worktree 已被拆 —— 收尾键给不出来（没有目录可拆）、
      执行键给不出来（收尾中不推进），任务永久卡住。③ 终态卡片只增不减，看板翻历史
      翻到满屏也清不掉一张。④ 取消键戴着垃圾桶，而它删不掉任何东西。
    why: |
      三把键的语义（用户 2026-10-06 拍板）：
      ① 完成 = 推进键给不出来时的出口（canComplete = !terminal && !stageRunning && !showAdvance
         && !(finishActive && canFinishWorktree)）。**不变式：非终态、非运行中的任务上，
         推进键与完成键至少有一个**；卡片与详情面板同一套口径。
      ② 取消只改状态，卡片留在终态列里还能翻回去看；图标是作废符（TaskCancelIcon），
         刻意不用垃圾桶。
      ③ 删除只给终态任务，且只删卡片本身（一个事务里删 tasks + stage_runs + task_events）；
         worktree / 分支 / 会话都不动 —— 那是「收尾」的职责。正在跑的任务拒绝删除，
         否则删了卡片就没人能停它。删完广播 task.deleted。
      重建入口从 UI 移除，但服务端端点与前端 rebuildTaskWorktree 保留（脚本 / CLI 用）。
