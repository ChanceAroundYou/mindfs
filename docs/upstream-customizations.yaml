      - server/internal/api/stream_hub.go:PendingSessionSnapshot
      - server/internal/api/appcontext.go:EndSessionTurn
      - web/src/App.tsx:refreshMultiProjectReplyingSessions

  - id: G-BE
    title: pending 的回合身份与单一终结器（迟到 done 不误抹新轮 + 终态边必达）
    kind: fix
    symptom: |
      「完成回答但还显示正在思考」（灯不灭）与「正在运行但会话列表灯不亮」（灯不亮）
      两个**相反**症状并存。根因不是超时，而是 pending 条目**没有回合身份**：
        灯不亮：第 A 轮迟到的 session.done 落地时，ClearSessionPending 无条件删条目，
                把第 B 轮刚开始的灯抹掉（且该 done 帧本身也会让前端按 key 清灯）；
        灯不灭：子会话只有 MessageDone 一条清理边，error/取消/父轮先结束都会让 pending 永久残留；
                runSessionMessage 无 defer，SendMessage panic/挂死时终结器走不到。
    why: |
      1) SessionPendingState 带回合身份（G-BH/S2e 起是 turn_id），每次 SetPending* 刷新；
         SetPendingUserAt/SetPendingReply/BroadcastSessionUserMessageAt 返回它。
      2) ClearSessionPending(key, turnID) 只在「两侧都有身份且一致」时才清；
         PendingTurnIDMatches 让 EndSessionTurn 对「别的回合的 done」整条丢弃（不广播帧）。
      3) 抽出唯一终结器 AppContext.EndSessionTurn(..., turnID)，所有终态边都走它；
         runSessionMessage / RunAgentStage / 定时任务 用 defer 覆盖成功/出错/取消/panic。
      4) 子会话在父轮收尾时一并终结（本轮创建、没等到 MessageDone 的那些）。
      这套「身份比对」机制项目里本就有（ActiveTurnID 用于取消定位，见 usecase/session.go），
      pending 缺的不是新机制，是把同一份纪律用上去。前端早已单一源（multiProjectPendingByKey），
      故本组不改前端。
    boundary: |
      服务端 pending 条目的身份与生命周期：谁有权清理、迟到/重复 done 的处置、
      子会话 pending 的终态收边。不做静态判死/超时（已于 G-AY 证伪）。
    tests:
      - server/internal/api/stream_hub_turn_identity_test.go
      - server/internal/scheduled/pending_identity_test.go
      - server/internal/agent/codex/session_test.go
      - web/tests/e2e-pending-indicators.test.mjs
    files:
      - server/internal/api/stream_hub.go
      - server/internal/api/appcontext.go
      - server/internal/api/ws.go
      - server/internal/scheduled/tasks.go
      - server/internal/agent/codex/session.go
    anchors:
      - server/internal/api/stream_hub.go:ClearSessionPending
      - server/internal/api/stream_hub.go:PendingTurnIDMatches
      - server/internal/api/stream_hub.go:SetPendingReply
      - server/internal/api/appcontext.go:EndSessionTurn
      - server/internal/api/appcontext.go:RunAgentStage
      - server/internal/api/ws.go:runSessionMessage
      - server/internal/scheduled/tasks.go:SessionActivityBroadcaster
      - server/internal/agent/codex/session.go:handleStreamedEvents

  - id: G-BG
    title: 会话窗口读不整表解析（冷开窗按需读 + tail 增量三处缺陷 + 搜索 cap + O1 两条全量 aux 热路径）
    kind: fix
    symptom: |
      ① 打开/切换会话时整个 root 停顿：冷缓存开窗走 readExchangesFull，解析整份主日志且
         持 m.mu。实测 1.19MB/206 行 15.3ms，会话越大越久；前端每 ~1.7s 轮询窗口端点，
         等于每隔一秒多就有人把 root 锁住十几毫秒 —— 用户体感是「同步后内容消失/界面卡住」。
      ② 同 seq 的后续版本读不到：readExchangeTail 里 entry.Seq <= baseSeq 直接 continue，
         于是 tail 追加里「与已缓存 seq 相同但更完整/更高 revision」的更新被跳过，
         页面继续显示旧内容，只有冷启动才碰巧看到对的。
      ③ tail 内同 seq 重复吐：loadExchanges 的增量分支盲 append，同一 seq 追加多行时
         窗口里出现重复条。
      ④ 完整性升级被误报成冲突：同 seq 的空占位被后来的完整回复覆盖时打
         conflicting duplicate seq，污染日志；空正文永不覆盖非空正文，只有「已有正文非空且与新正文不同」才算真冲突。
      ⑤ 含超长行的会话整个搜不到：搜索的 bufio.Scanner 上限写死 1MB，而主日志解析上限是
         maxExchangeLineBytes(64MB)，单行 >1MB 就让 Search 返回 ErrTooLong。
      ⑥ 列表页对每个命令会话全量读 aux：fillCommandShells → GetExchangeAux(key,0)。
         实测单会话 aux 最大 19MB，11.8MB 那次 281ms，且持 m.mu。
      ⑦ 非窗口化的 sync 全量读 aux 再过滤：handleSessionSync 无条件 Seq:0；
         handleSessionGet 早就按窗口只取窗口内 seq 的 aux（G-AT），这条漏了同一个优化。
    why: |
      1) getSessionWindowUnsafe 冷缓存改走 readExchangeWindow：读盘一次 → 字节级行计数
         （bytes.Count 思路，不解析 JSON，实测 1.2MB/0.14ms）拿 Total → 只解析尾部
         need+1 条（多一条只为判 hasMore）。Total 在冷缓存下取非空行数而非
         len(全部记录)：实测 310 份真实主日志/2172 行，0 空行、0 同 seq 多行，只有 1 份
         maxSeq 与行数差 86；退化日志会显示重复条数，S2d 之后主日志只剩元数据，此代价消失。
      2) 尾部读刻意不复用 readAuxWindowTail 的逐块反向读：那个实现会丢掉每个分块的首条
         半行，单行最大 308KB 的主日志会被静默丢记录。改成「只读一个后缀、起点对齐换行」的
         单次读，span 按 4 倍增长。
      3) 新增 mergeExchangeRecord / mergeExchangeRecords：新 seq 追加（与全量读同一
         「按文件序」假定），同 seq 原位替换且保留原位置；空内容永不覆盖非空内容；仅
         「两条都非空且内容不同」才打冲突告警。readExchangesFull 的逐行合并改为调用它，
         全量与增量从此共用一套合并语义。
      4) readExchangeTail 去掉 seq<=baseSeq 跳过，改为返回全部解析结果，去重交给
         mergeExchangeRecords —— 这条路径在最热的读取路径上，同 seq 的更新必须看得见。
      5) 新增 Manager.GetCommandShell：aux 尾部有界读（512KB 起步、4 倍增长），命中即停；
         fillCommandShells 改用它，判据仍是 InferCommandShellFromAux。
      6) handleSessionSync 改为与 handleSessionGet 同构：有 windowMeta 就按窗口内 seq 取
         aux（走 G-AT 的 CompactExchangeAuxLight），否则维持 Seq:afterSeq。
    boundary: |
      会话窗口读（GET /api/sessions/{key}?latest= / ?before_seq=、窗口化 sync）与列表页的
      shell 标签推断，必须 O(窗口) 或 O(尾部命中)，不得整表解析、不得全量读 aux。
      实时写路径、Full 同步、import、repoint、子代理同步都不动。
    tests:
      - server/internal/session/manager_window_cold_test.go
      - server/internal/session/manager_incremental_merge_test.go
      - server/internal/session/manager_search_test.go
      - server/internal/session/manager_aux_tail_test.go
      - server/internal/api/http_window_test.go
      - server/internal/api/usecase/usecase_test.go
      - web/tests/session-window.test.mjs
    files:
      - server/internal/session/manager.go
      - server/internal/api/http.go
      - server/internal/api/usecase/session.go
      - web/tests/session-window.test.mjs
    anchors:
      - server/internal/session/manager.go:readExchangeWindow
      - server/internal/session/manager.go:mergeExchangeRecord
      - server/internal/session/manager.go:mergeExchangeRecords
      - server/internal/session/manager.go:readExchangeTail
      - server/internal/session/manager.go:countExchangeRecords
      - server/internal/session/manager.go:GetCommandShell
      - server/internal/session/manager.go:readAuxTailEntries
      - server/internal/api/http.go:handleSessionSync
      - server/internal/api/usecase/session.go:fillCommandShells

  - id: G-BF
    title: Full 同步丢最新几轮（ctx_seq 切片恒空 + 时间地板被静默跳过）
    kind: fix
    symptom: |
      用户手点「同步」后，会话**最新几轮回复永远补不回来** —— 不是「导重复」，是
      「一条都导不到」。实测某会话库 119 行、导入器全量只有 83 条（实时路径会写导入器
      不产出的 tool-only 空占位行），agent_ctx_seq 被刷成库长度 115，imported[115:]
      恒为空 → ImportedCount 恒为 0，反复点「同步」也白点。
    why: |
      1) readClaudeImportedExchangeLocators 只在 committedOffset>0 或 bootstrapAfter 非零时
         应用时间地板；Full 同步恰恰两者都不传（Cursor/AfterTimestamp 只在 !in.Full 里设），
         于是 TimestampFloor 被静默跳过 —— 与 types.go 里「非零时无论有没有字节游标都
         只接受比它晚的条目」的契约直接矛盾。修复：只要地板非零就过滤。
      2) SyncExternalSessionDelta 的 Full 分支原先无条件按 binding.AgentCtxSeq 切片。
         agent_ctx_seq 语义是「导入器条数游标」，代码却把它刷成 len(latest.Exchanges)
         （库行数）—— live-owned 会话这两个数系统性不相等（库行数 > 导入器条数），
         切片恒空，把第 1 条的地板修复也一起废掉。修复：live-owned 的 Full 同步改由地板
         圈定增量、不再叠序号切片；import-owned 的库与转录按序号对齐，ctx_seq 切片仍是
         正确边界，保持不变。
      3) 两个写入者的幂等护栏 exchangeAlreadyRecorded 仍在：地板只放行「比库里最新一条
         更新」的条目，这些条目必然不在库里，护栏不会误伤；真出现内容相同但时间戳差 >5s
         的重尾会保留为独立行；读路径不再按内容隐藏记录，防止误删真实回合。
    boundary: |
      Full 同步的增量圈定：live-owned 会话「比库里最新一条更新」的尾段导不进来。
      非 Full 的常规增量同步、import-owned 会话、子代理同步、repoint 游标推进都不动。
    tests:
      - server/internal/agent/claude/importer_test.go
      - server/internal/api/usecase/external_sessions_test.go
    files:
      - server/internal/agent/claude/importer.go
      - server/internal/api/usecase/external_sessions.go
    anchors:
      - server/internal/agent/claude/importer.go:readClaudeImportedExchangeLocators
      - server/internal/api/usecase/external_sessions.go:SyncExternalSessionDelta
      - server/internal/api/usecase/external_sessions.go:externalSessionDeltaAfterCtxSeq

  - id: G-BI
    title: 会话身份收敛为两套 id（mindfs_id + agent_id，NativeTurn/NativePrompt/NativeID 合并）
    kind: arch
    symptom: |
      系统里出现第三套 id：turn_id（MindFS 铸的、落盘）、native_turn/native_prompt
      （agent 回查键）、pending 灯另算一套 TurnGen，而 ACP 与 claude 各自带回的
      messageId / uuid 又无处安放 —— 「同一个回合叫什么」这个问题在四处各有答案。
      更实际的故障：**导入路径根本不铸 turn_id**，导入行与实时行只能靠「内容相似
      + ±5 秒」猜，而这两个判据在 Full 同步重放场景下必然失效（实测 9 对重复行）。
      ACP 还把 MindFS 传入的 turn id 当成 agent 原生身份，pending 又按预测 seq 独立铸 id；
      identity 即使字段齐全，只要来源和角色语义混用，仍会把回显认错或让 pending 对不上。
    why: |
      1) 全系统只留两类 id：mindfs_id（MindFS 在写入点统一铸，系统内唯一、不变，
         是实际使用的那个）与 agent_id（agent 返回的，claude 转录 uuid / ACP
         messageId，格式随 agent 而异，只作桥梁）。判定顺序：先 agent_id 再
         mindfs_id，两层都对不上才退到「内容 + ±5s」（写入侧幂等 exchangeAlreadyRecorded
         必须保留 —— 它拦的是实时写入与 Full 同步导入撞车）。
      2) mindfs_id 由 NewMindFSID(agentID, fallbackSeed) 统一铸：UUIDv5（namespace +
         seed 的 SHA-1 前 16 字节，不引 google/uuid），于是**同一轮的 live 与 import
         两侧铸出同一个 id** —— 导入侧不再需要伪造 turn_seq 去对齐。seed 优先取
         agent_id，没有才退到 sessionKey|role|seq。老的自指假身份
         （persistUserTurnExchange 里 nativePrompt = turn_id）一并删掉。
      3) NativeTurn / NativePrompt / NativeID 三个字段合并成一个 AgentID：它们本来就是
         「agent 侧回查键」这一个概念，拆三个只会让判重口径分叉（claude 写
         native_turn、ACP 写 native_prompt，同一件事两套写法）。claude 侧
         handleAssistantMessage 取 msg.UUID 当 MessageID 带出去，补齐实时这一半 ——
         此前只有导入侧有 agent id，两侧永远对不上。
      4) 兼容性走 UnmarshalJSON（turn_id / native_turn / native_prompt / native_id
         四个旧键映射到新字段，同名字段优先），而不是加一堆 `json.RawMessage` 散布在
         各结构体里 —— 键名一旦写进盘，改名就必须留读路径，否则 320 个历史会话
         全部读成「没有身份」。
      5) pending 不再独立 mint user turn id：它只接收 persistUserTurnExchange 返回的
         canonical mindfs_id；pending、用户回声与落盘行共用同一个值，不受 caller 对 seq
         的预测影响。
      6) 字段改名后 IsMindFSIDShape 是唯一形状判据；前端 SessionBlock 同步为
         mindfs_id / agent_id。
      7) 2026-10-12 前端延伸：session.user_message 和 session.stream 携带本轮
         mindfs_id；实时缓存按 id 合并，overlay 只在角色类别和 mindfs_id 同时匹配时
         抑制瞬时副本。同正文不同 id 保留，无 id 的流式项继续展示。
      8) 用户行的 id 在 Manager 锁内按真实分配的 seq 铸造，MessageStart 将落盘行返回的
         mindfs_id 原样交给 pending 与用户回声。ACP 收到的是 MindFS turn id；回显时仅以
         user 行的 mindfs_id 做精确桥接比较，不写入 agent_id。移除 UsesPromptMessageID
         能力分支，避免把「收到 MindFS turn id」误当成「agent 提供原生消息 id」。
    boundary: |
      会话轮次元数据的字段名与铸造规则：Exchange.AgentID、Block.AgentID、
