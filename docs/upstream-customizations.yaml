  - id: G-G
    title: 会话生命周期与 WS 正确性
    kind: fix
    symptom: "点停止按钮没反应；「正在生成」标记卡住不消；多项目实时更新滞后或错乱。"
    why: "ws.go 是单读 goroutine，所有 handler 必须异步派发 —— 同步派发会让一个阻塞的 handler 冻结整条连接（停止按钮失效就是这么来的）。agent session 的 Interrupt 用了 context.Background()，CLI 不 ack 就永不返回，调用方必须加超时包装；取消路径上每一处跨进程 RPC 都要带超时（守卫 cancel_rpc_timeout_guard_test.go）。session_created_broadcast_test.go 的 dialHub 另有一道注册屏障：少了它，紧跟的广播会打在空 hub 上被静默丢掉，而单跑必过、并行才红，很容易被当成偶发删掉 —— 它是这条广播契约唯一的守卫。"
