  - id: G-AY
    title: pending 纯派生（done 丢失时停止符号 /「正在思考」卡住）
    kind: fix
    symptom: |
      任务已结束，输入框仍显示停止符号；查看器仍「正在思考」；用量/上下文窗口面板不出现；
      但会话栏是正常的（列表收敛、抽屉不收敛，两边看起来不一样）。
    why: |
      pending 不落盘（sessions 表无此列，sessionListResponse 也不发），纯前端 optimistic。
      原先前端有**五份投影**（缓存 / 抽屉 / 选中 / pendingBySessionRef / multiProjectPendingByKey）。
      只有列表蓝灯那份每 5s 从 /api/replying-sessions 对账；其余四份只有 WS session.done 一个出口
      —— BroadcastSessionDone 只发给 session.ready 绑定的客户端（GetSessionClientIDs），
      而 WS 连接会反复 1006 unexpected EOF 断连，重连后绑定竞态一丢那条事件，那四处就永久停在 true。
      实测（journalctl）：1791307447-6f646793904d 广播了 session.done，其后却没有
      GET /api/sessions?root=… 重拉 —— 证明该 WS 事件没被前端处理。
      2026-10-07 改成纯派生：唯一真相 multiProjectPendingByKey，会话对象上不再存 pending。
    boundary: |
      「这个会话在不在回复」这一份状态的存放方式。合上游时若退回「会话对象上存 pending」，
      就又会裂成多份、又会在丢 session.done 时永久卡住。第一版修法是给四处补一条对账
      （clearStalePending + 一个 effect）—— 那是打补丁：第二份状态还在，就还得再写一套
      「怎么同步第二份状态」的代码。改成纯派生后没有第二份状态，也就没有「两份不同步」。
      2026-10-09 补完：当时漏了最后一处 —— `useSessionStream` 的本地 `isStreaming` 只由 WS
      事件清（done / message_done / error），**没有轮询对账**，于是「列表蓝灯与停止键已被
      5s 轮询救回、流里『正在生成』永久不灭」这个半死不活的形态正是它。治法与 G-AY 同、
      不新设状态：导出的 `isStreaming` 一律收在 `sessionPending` 闸门下（一个收口点），
      显不显示只由 pending 决定，本地标记退化为「措辞/盒子」的子状态。
      同一个闸门也顺带治了它连带的两处：最后一条不显示时间戳、A/B 轮措辞错。
    tests:
      - web/tests/pending-single-source.test.mjs
    files:
      - web/src/App.tsx
      - web/src/app/useRealtimeEvents.ts
      - web/src/app/appSession.ts
      - web/src/hooks/useSessionStream.ts
      - web/src/components/session/SessionViewer.tsx
    anchors:
      - web/src/App.tsx:setMultiProjectSessionPending
      - web/src/App.tsx:getSessionSnapshot
      - web/src/app/appSession.ts:mergeReplyingStateByNode
      - "web/src/hooks/useSessionStream.ts:isStreaming: isStreaming && !!sessionPending"
      - "web/src/components/session/SessionViewer.tsx:{isAwaiting && (() => {"

