  - id: G-BF
    title: Full 同步丢最新几轮（ctx_seq 切片恒空 + 时间地板被静默跳过）
    kind: fix
    symptom: "用户手点「同步」后，会话最新几轮回复永远补不回来 —— 不是「导重复」，是「一条都导不到」。实测某会话库 119 行、导入器全量只有 83 条，agent_ctx_seq 被刷成库长度 115，imported[115:] 恒为空 → ImportedCount 恒为 0，反复点「同步」也白点。"
    why: "① readClaudeImportedExchangeLocators 只在 committedOffset>0 或 bootstrapAfter 非零时应用时间地板，而 Full 同步恰恰两者都不传，于是 TimestampFloor 被静默跳过 —— 与 types.go 里「非零时无论有没有字节游标都只接受比它晚的条目」的契约直接矛盾。② SyncExternalSessionDelta 的 Full 分支原先无条件按 binding.AgentCtxSeq 切片，而 agent_ctx_seq 语义是「导入器条数游标」，代码却把它刷成 len(latest.Exchanges)（库行数）—— live-owned 会话这两个数系统性不相等，切片恒空。修复：地板非零就过滤；live-owned 的 Full 同步改由地板圈定增量、不再叠序号切片。"
    boundary: "Full 同步的增量圈定：live-owned 会话「比库里最新一条更新」的尾段导不进来。非 Full 的常规增量同步、import-owned 会话、子代理同步、repoint 游标推进都不动。"
    tests:
      - server/internal/agent/claude/importer_test.go
      - server/internal/api/usecase/external_sessions_test.go
    files:
      - server/internal/agent/claude/importer.go
