  - id: G-BJ
    title: 会话列表按实时活动时间排序 + 退役多项目列表预渲染缓存
    kind: fix
    symptom: "列表排序键是 updated_at：服务端只在回合收尾推进它，于是回复还在流的时候会话停在原地、回答完了才跳一下；切走再回来时顺序又回去了。多项目列表另有一层 IndexedDB 预渲染按账户存整份快照，会先画上一次的结果再被节点响应重排 —— 用户看到列表「闪一下又变」。"
    why: "新增客户端专属覆盖层 activity_at（不落盘）：流事件到达就把它盖到会话与项目分组上，100ms 粒度（Math.floor(t/100)*100，避免纯前端漂移让排序抖动）。覆盖必须插在「节点归属过滤」之前 —— 那条过滤会把发往别的节点的帧丢掉，而活动时间要在任何重排之前先推进。合并只认更新的覆盖层，绝不把活动时间往回拨；一旦持久 updated_at 追上，覆盖层自动删除。项目分组改按节点表顺序分区，未配置的节点排最后且顺序稳定。退役多项目预渲染与其缓存键。活动时间重排加 30s 迟滞阈值：两个都在跑的会话每 100ms 交替推进 activity_at，比较器按毫秒直接比大小会让列表疯狂交替。"
    boundary: "排序键与流事件如何推进它；多项目预渲染的退役。C1 补色、C2 逐组合并、_unreachable 三条定制全部保留。"
