  - id: G-BJ
    title: 会话列表按实时活动时间排序
    kind: fix
    symptom: "会话回复期间，项目组与会话行仍显示上次完整回复时的时间，排序也等到整轮结束才更新；置顶区和普通区各自的顺序还会被 pin 时间、项目名称或当前分页碰巧返回的首行误导。"
    why: "stream block 到达时，前端用 100ms 粒度推进临时 activity_at；会话排序、项目分组排序与相对时间标签统一读 max(updated_at, activity_at)，所以无需每个 token 写一次 session metadata，也无需等完整回复。mergeSessionItems 保留较新的 activity_at，直到持久 updated_at 追上才清除临时值，避免刷新把活跃条目倒退。项目组的持久最新时间必须从 indexed session metadata 全表取 MAX —— 用列表第一个 session 推断会受分页、排序和空列表影响。会话置顶只决定项目内的分区；项目列表以配置节点顺序为外层分区，禁止跨节点比较 pin 或活动时间。多项目列表若先画 IndexedDB 旧快照再用节点结果校正，会在打开时出现第二次排序跳动，因此只退役多项目列表的持久快照预显示（单项目列表缓存与会话内容缓存保留）。"
    boundary: "仅会话列表/项目分组的活动时间投影、排序和 metadata 聚合查询。activity_at 是前端临时字段，不落盘；实时正文事件的身份、内容与块写入不变。"
