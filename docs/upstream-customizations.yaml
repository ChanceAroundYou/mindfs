  - id: G-BH
    title: 会话正文块流（Block 存储层 + 轮次身份 turn_id/turn_seq/native_* + S2a 双写 + S2b 读改走块流 + C1/C2 + S2d-2 主日志不再存正文 + S2e pending 身份改用 turn_id）
    kind: fix
    symptom: "① 回复结束后助手正文消失：一轮正文只拼 text 块，而 os 模型约 15% 的轮次只产出 reasoning，落库成 content:\"\"（实测空正文占比 claude::os 39%、dsh::os 13%）；② 一轮正文没有权威身份，只能靠内容比对 + 时间戳窗口猜；③ repoint / fork 之后 native id 与新转录错配；④ 服务端发起的轮次没有 turn_id 可采纳；⑤ 同步把已存在的轮次又写一遍（实测 live-owned 会话 Full 同步后多出 9 对重复行）；⑥ ACP 导入丢 reasoning（AgentThoughtChunk 整个被丢掉）；⑦ 块流与主日志 content 双写是两份真相；⑧ user 行被空内容守卫整行吞掉 —— 前端表现为「我说过的话不见了」，且没有任何报错；⑨ assistant 分析块错挂到 user 行，重开后分析文本被当成用户消息展示。"
    why: "新增 sessions/<key>.blocks.jsonl 块流，一行一块，pos 取代旧 aux 的 line，同 (seq,pos) 多版本按 revision 取最高；Manager.AppendBlocks / ReadBlocks / GetBlocksWindow 走 append-only JSONL（坏行跳过不报错）。Exchange 加轮次元数据 turn_id / turn_seq / native_* / partial，用 context 值传递而不是给调用点加参数。BuildTurnBlocks 编译出的块序必须与前端 buildAssistantTimeline 的既有渲染顺序逐条一致 —— S2b 起块序就是渲染序，不一致等于切换读路径时正文顺序会变。S2d-2 起主日志 content 恒空，块流是正文唯一载体；addExchangeForAgentAt 的空行守卫改成「什么都没带」才算空行，否则每一行 user 被静默丢掉。窗口读必须 O(窗口)：反向分块读刻意不复用 readAuxWindowTail（那个实现会丢掉每块首个不完整行，而块流一行可达 700KB）。身份判重顺序是「先身份、后内容」，有身份且库里对不上就一律落库（永不猜）。"
    boundary: "会话正文的存储、身份与读取：块流格式、块写入点、轮次元数据字段、turn_id 生成与清理、窗口读走块流、前端按 type 渲染块。S2a（双写，读路径不动）、S2b（读路径切块流）、S2d-2（主日志 content 恒空）、S2e（pending 灯身份从单调代次换成 turn_id）是四个可独立回滚的提交。主日志格式兼容：没有身份字段的历史行读成零值，不报错；content 字段保留为 LegacyContent（json tag 不改名）以兼容存量文件与回填输入。"
