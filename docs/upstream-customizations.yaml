  - id: G-AS
    title: ACP 提问：dsh 的 ask_user_question 走 elicitation
    kind: fix
    symptom: |
      在 dsh 会话里让 agent 提问，工具直接返回
      "Error: the ACP client does not support form elicitation"，提问卡根本不出现，
      用户没有任何途径回答；模型只拿到一条失败的工具结果，继续瞎猜。
    why: |
      根因三条缺一不可：① Process.Initialize 只广告 Terminal: false，没有 elicitation.form
      → openma 适配器的 clientElicitationForm = false → installAcpUserQuestionProvider
      直接抛 CLIENT_UNSUPPORTED；② mindfsClient 没有 UnstableCreateElicitation，
      就算广告了能力也是 -32601 Method not found；③ (*session).AnswerQuestion 是硬编码
      "ask user question is not supported by acp sessions"，答案无处可去。
      上游 ACP 客户端没有 elicitation 通路，这三条都是本 fork 补的，合上游会被整体覆盖。
      设计要点：只对 agentName == "dsh" 广告 elicitation.form；SDK 的
      UnstableCreateElicitationForm 不带 sessionId/toolCallId（fork codegen 丢了），
      靠题目 id + 文本逐字相同关联，等 2s 窗口覆盖「elicitation 先到、tool_call 通知后到」
      的 SDK 队列时序；刻意不做「只剩一张卡就绑它」的兜底（并发提问时会答错题）；
      tool_call 与 tool_call_update 两个分支都要重标 kind=ask_user + meta.questions
      （否则 mergeBufferedToolCall 会把 kind 覆盖回 other）；答案编码对齐 openma 的
      answerFromElicitation（question_<i> = option_<j> / question_<i>_custom，
      单选命中选项时不得再带 _custom）；取消与关闭按 sessionKey 回 Decline，
      投递恰好一次由 elicitationMu 保证。三条「没被回答就结束」的路（正常回答 /
      handler 的 ctx 取消 / 工具卡进终态）都必须释放条目并放出 waiter —— 漏一条就留下
      bound 条目，后续同题会被优先匹配到它、答案投进没人读的 waiter。另有一个静默坑：rawInput 是工具参数的蛇形
      multi_select，_meta 是 seam 对象的驼峰 multiSelect，读错一个字母会让多选答案
      静默编错（提问照常出现）。
