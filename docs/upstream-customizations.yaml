  - id: G-J
    title: 多节点聚合与按 nodeId 路由
    kind: arch
    symptom: |
      切换节点后请求仍打旧节点（切了没反应）；跨节点同名项目串在一起；
      节点列表里同一台机器有两个不同 id；远端节点的小蓝灯永远不亮。
    why: |
