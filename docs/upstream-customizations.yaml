  - id: G-W
    title: worktree 会话 repoint（把会话从已删工作树搬回主 checkout）
    kind: fix
    symptom: |
      worktree 目录删掉后，那个会话读得到却「不能继续聊」：
      mindfs 侧 related_worktree 钉着不存在的 cwd，与主 checkout 的转录互相打架。
    why: |
      repoint 四件事有固定顺序：换 agent_session_id（fork 转录搬进主 slug）
      → 一个事务里换绑定 id 并推进游标 → ClearRelatedWorktree。
      两个必须守住的坑：游标要推进到新转录 EOF（归零会让下次 Full 同步整份重读，
      出现「ask 下面又渲染一轮出现过的文字」）；agent_ctx_seq 必须原样保留
      （它是 Full 同步的幂等护栏，写 0 会让早已渲染过的回合重导一遍）。
      另外：转录已在主 slug 时不需要 repoint，只需清 related_worktree。
    anchors:
      - 'web/src/components/WorktreeBranchSelector.tsx:CUSTOM(G-W)'
