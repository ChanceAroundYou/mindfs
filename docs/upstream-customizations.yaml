      - web/src/app/useSessionStreamCache.ts
      - web/src/app/useRealtimeEvents.ts
      - web/src/shared/sessionOverlay.ts
      - server/internal/api/stream_hub.go
      - server/internal/api/ws.go
      - server/internal/api/ws_test.go
