  - id: G-X
    title: 置顶（pins）—— 控制面权威 + 每账户一份
    kind: feature
    symptom: |
      在 PC 的项目里置顶没反应；置顶刷新后就没了（前端自己拼键，与服务端分叉）；
      worker 节点列表永远没有置顶区。
    why: |
      置顶是「权威在主节点、但按账户一份」的双维度设计：控制面端点（/api/pins，worker 上 403），
      存储每账户一份（pins/store.go）。正常路径的会话键是 `rootID::sessionKey`，**不带 node id**
      —— 带 node id 就等于又按机器分片（SessionScopeKey 保留 nodeID 前缀仅用于回填旧键）。
      列表端只从置顶表取（Manager.ListByKeys，只查 meta）；worker 列表的置顶由
      applyPinnedSnapshotToSessions 把主节点那份**盖**上去（只抹不盖会得到「在 PC 的项目里置顶没反应」）。
      会话库的 sessions.pinned_at 已退役，刻意不与置顶表做并集（两份真相迟早分叉）。
      项目置顶从共享偏好**一次性**回填（NeedsLegacySeed）——回填做第二次会让用户取消掉的置顶每次重启复活。
