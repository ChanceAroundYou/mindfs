      历史上 release-notes.md 的整段条目就是这样静默丢失过的。
    why: |
      上游完全没有这些文件（AGENTS.md、上游定制清单、多账户/多节点 PRD、设计稿）。
      AGENTS.md 的「fork 定制与上游合并（必守）」一节是本清单的规则来源，
      它一旦丢，整套定制保护机制就失去依据。
