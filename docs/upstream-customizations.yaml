  - id: G-BI
    title: 会话身份收敛为两套 id（mindfs_id + agent_id，NativeTurn/NativePrompt/NativeID 合并）
    kind: arch
    symptom: |
      系统里出现第三套 id：turn_id（MindFS 铸的、落盘）、native_turn/native_prompt
      （agent 回查键）、pending 灯另算一套 TurnGen，而 ACP 与 claude 各自带回的
      messageId / uuid 又无处安放 —— 「同一个回合叫什么」这个问题在四处各有答案。
      更实际的故障：**导入路径根本不铸 turn_id**，导入行与实时行只能靠「内容相似
      + ±5 秒」猜，而这两个判据在 Full 同步重放场景下必然失效（实测 9 对重复行）。
      ACP 还把 MindFS 传入的 turn id 当成 agent 原生身份，pending 又按预测 seq 独立铸 id；
      identity 即使字段齐全，只要来源和角色语义混用，仍会把回显认错或让 pending 对不上。
    why: |
      1) 全系统只留两类 id：mindfs_id（MindFS 在写入点统一铸，系统内唯一、不变，
         是实际使用的那个）与 agent_id（agent 返回的，claude 转录 uuid / ACP
         messageId，格式随 agent 而异，只作桥梁）。判定顺序：先 agent_id 再
         mindfs_id，两层都对不上才退到「内容 + ±5s」（写入侧幂等 exchangeAlreadyRecorded
         必须保留 —— 它拦的是实时写入与 Full 同步导入撞车）。
      2) mindfs_id 由 NewMindFSID(agentID, fallbackSeed) 统一铸：UUIDv5（namespace +
         seed 的 SHA-1 前 16 字节，不引 google/uuid），于是**同一轮的 live 与 import
         两侧铸出同一个 id** —— 导入侧不再需要伪造 turn_seq 去对齐。seed 优先取
         agent_id，没有才退到 sessionKey|role|seq。老的自指假身份
         （persistUserTurnExchange 里 nativePrompt = turn_id）一并删掉。
      3) NativeTurn / NativePrompt / NativeID 三个字段合并成一个 AgentID：它们本来就是
         「agent 侧回查键」这一个概念，拆三个只会让判重口径分叉（claude 写
         native_turn、ACP 写 native_prompt，同一件事两套写法）。claude 侧
         handleAssistantMessage 取 msg.UUID 当 MessageID 带出去，补齐实时这一半 ——
         此前只有导入侧有 agent id，两侧永远对不上。
      4) 兼容性走 UnmarshalJSON（turn_id / native_turn / native_prompt / native_id
         四个旧键映射到新字段，同名字段优先），而不是加一堆 `json.RawMessage` 散布在
         各结构体里 —— 键名一旦写进盘，改名就必须留读路径，否则 320 个历史会话
         全部读成「没有身份」。
      5) pending 不再独立 mint user turn id：它只接收 persistUserTurnExchange 返回的
         canonical mindfs_id；pending、用户回声与落盘行共用同一个值，不受 caller 对 seq
         的预测影响。
      6) 字段改名后 IsMindFSIDShape 是唯一形状判据；前端 SessionBlock 同步为
         mindfs_id / agent_id。
      7) 2026-10-12 前端延伸：session.user_message 和 session.stream 携带本轮
         mindfs_id；实时缓存按 id 合并，overlay 只在角色类别和 mindfs_id 同时匹配时
         抑制瞬时副本。同正文不同 id 保留，无 id 的流式项继续展示。
      8) 用户行的 id 在 Manager 锁内按真实分配的 seq 铸造，MessageStart 将落盘行返回的
         mindfs_id 原样交给 pending 与用户回声。ACP 收到的是 MindFS turn id；回显时仅以
         user 行的 mindfs_id 做精确桥接比较，不写入 agent_id。移除 UsesPromptMessageID
         能力分支，避免把「收到 MindFS turn id」误当成「agent 提供原生消息 id」。
    boundary: |
      会话轮次元数据的字段名与铸造规则：Exchange.AgentID、Block.AgentID、
      NewMindFSID、exchangeAgentKey / exchangeIdentityRecorded、stream_hub 待亮灯身份。
      2026-10-12 延伸包含事件和缓存携带 mindfs_id，以及 overlay 按身份对账；用户行身份
      按 Manager 实际分配的 seq 铸造并复用到 pending。块流正文格式未变；写入侧身份判重
      由 G-BI 提供，读时内容投影已于 2026-10-12 由 G-AB 退役。
    tests:
      - server/internal/session/manager_rename_compat_test.go
