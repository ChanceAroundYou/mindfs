  # ── 性能：列表投影与条件请求 ────────────────────────────────────
  - id: G-AN
    title: 列表投影瘦身与条件请求（ETag / 304）
    kind: perf
    symptom: "列表刷新整份重传：会话列表 149KB、跨项目看板 163KB，其中「恒为空」的键占四分之一强，看板卡片里 43% 的 stages 前端从来不读；空闲时反复拉同一份列表也拿不到 304。"
    why: "列表接口是最高频的请求，改为服务端按请求现算投影 + ETag（respondJSONList 省略恒为空的键并支持 If-None-Match 回 304）。但这张投影表不是「只留 id」：create_worktree / worktree_path / worktree_built / worktree_missing 四个字段必须留 —— 卡片上的 worktree 徽标就靠它们推，2026-10-07 实测「工作台所有任务都显示没有 worktree」就是投影把它们丢了。详情类端点走 respondJSONConditional：只协商、不瘦身（删键即静默丢数据）。客户端 services/api.ts 必须先判 304 再判 response.ok（304 的 ok 是 false）。单会话详情也接上协商，并另加字节预算 conditionalRequestBytesMax。"
    files:
      - server/internal/api/helpers.go
      - server/internal/api/http.go
      - server/internal/api/http_tasks.go
