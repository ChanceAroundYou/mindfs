      validateTarget / InspectWorktree / ListWorktrees 三处都用 filepath.Clean 直接比较，
      在「项目根是符号链接」时全部误判。
    boundary: |
      路径比较必须先解析符号链接（EvalSymlinks）；MainCheckoutPath 的返回值语义不变
      （对主 checkout 返回调用方给的路径），只在比较处统一。
