  - id: G-IY
    title: 后端文件长度规则对齐前端（软 300 / 硬 500）+ 存量分批拆分
    kind: arch
    symptom: "后端规则是软 2000 / 硬 4000，前端是软 300 / 硬 500，同一目的两套数值差 6 倍；结果是 server/internal/api/usecase/session.go 1496 行、api/appcontext.go 1465 行这类「一个文件四五个不相干职责」的形态能长期存在。改造前存量 43 个源码 + 18 个测试文件超硬线。"
    why: "两条规则服务同一个目的（「一个文件一个职责，改哪读哪」），数值差 6 倍没有技术理由。软线的语义是判据（超过就判断职责边界并记录拆分安排），不是一次性清理项——与前端同区间 77 个文件的口径一致。合上游时 rules/plans 文档本身也会被整份覆盖，规则数值会被静默退回 2000/4000，而下游没人会注意到。"
    boundary: "改后端规则数值（docs/agent/rules/backend/file-size.md）+ 存量的分批清理登记（docs/agent/rules/backend/TODO.md）+ 执行计划（docs/plans/backend-file-size-300-500.md）。全部为同包内移动或同包内新增文件：无签名变化、无 type 位置变化（跨文件同包可见）、无 import 路径变化、零数据迁移。agent/codex/importer_tool_calls.go 与 kanban/worktree_finish_stage.go 已论证过边界，本轮不再拆。"
