      那一段卡在待审核，而 worktree 已被拆 —— 收尾键给不出来（没有目录可拆）、
      执行键给不出来（收尾中不推进），任务永久卡住。③ 终态卡片只增不减，看板翻历史
      翻到满屏也清不掉一张。④ 取消键戴着垃圾桶，而它删不掉任何东西。
    why: |
      三把键的语义（用户 2026-10-06 拍板）：
      ① 完成 = 推进键给不出来时的出口（canComplete = !terminal && !stageRunning && !showAdvance
         && !(finishActive && canFinishWorktree)）。**不变式：非终态、非运行中的任务上，
         推进键与完成键至少有一个**；卡片与详情面板同一套口径。
      ② 取消只改状态，卡片留在终态列里还能翻回去看；图标是作废符（TaskCancelIcon），
