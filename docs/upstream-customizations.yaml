  - id: G-AY
    title: pending 信号兜底（ClearSessionPending 2s 超时 + 广播先于清）
    kind: fix
    symptom: |
      对话完成后仍显示「正在生成」+ 停止键，用户以为还在跑，实际早已完成。
      根因：BroadcastSessionDone 中 ClearSessionPending 自旋无超时，replay 客户端排不空时
      卡住，session.done 广播永远发不出去，前端 pending 永远 true。
    why: |
      只剩第①层（必修）：服务端 ClearSessionPending 加 2 秒超时 + 广播挪到清之前。
      第②③层已于 2026-10-08 删除（同日引入同日删）：
      ② 服务端 LastEventAt 字段 + PendingSessionSnapshot 30 秒超时判据是**死代码** ——
         Active 字段没有任何消费方（唯一消费者 notifySessionDone 不读它），删前删后行为一致。
      ③ 前端 lastStreamEventAtRef + 15 秒静默降级是**真 bug** —— 真在跑的会话会长时间没有
         stream 事件（服务端不转发 SDK 的 keep_alive，唯一的周期事件 ToolProgressMessage
         只覆盖 tool 执行），按静默判「已结束」会「明明在跑却灭灯」、亮灯时长随事件节奏漂移。
      ③ 想兜的「WS 断连」场景，5s 轮询已经兜住（ClearSessionPending 在回合结束时删条目，
         下一轮轮询就灭灯），所以它纯属多余且有害。
    boundary: |
      「会话完成后 pending 信号必须消失」这一行为的实现方式（**超时兜底那一面**）。
      合上游时若退回「ClearSessionPending 无超时自旋」，就又会卡住。
      **注意：本题的「自旋无超时是根因」经 2026-10-09 复核为误判** —— 两个相反症状
      （灯不灭 / 灯不亮）的真正结构性成因是 pending 条目没有回合身份，见 G-BE。
    tests:
      - web/tests/e2e-pending-signal.test.mjs
      - web/tests/pending-single-source.test.mjs
    files:
