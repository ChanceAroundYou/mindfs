  - id: G-BH
    title: 会话正文块流（Block 存储层 + 轮次身份 turn_id/turn_seq/native_* + S2a 双写 + S2b 读改走块流 + C1/C2 + S2d-2 主日志不再存正文 + S2e pending 身份改用 turn_id）
    kind: fix
    symptom: |
      ① 回复结束后助手正文消失：一轮正文只拼 text 块（usecase/session.go 的
         responseText = appendResponseChunk），而 os 模型约 15% 的轮次只产出 reasoning、
         没有任何 text，于是落库成 content:""。流式时 thought_chunk 实时推所以看得见，
         收尾落库后正文瞬间消失；点同步也救不回（两个 importer 都不收 thought）。
         实测空正文占比：claude::os 39%、dsh::os 13%（claude::of 5%、dsh::of 2%）。
      ② 一轮正文没有权威身份：主日志只有 seq/role/content，没有 turn_id，于是
         「同一个回合有两个写入者」只能靠内容比对 + 时间戳窗口猜（投影 rule A/A2/B）。
      ③ repoint / fork 之后 native id 与新转录错配（repoint.go:35 明载 fork 后 claude
         产出全新 uuid）：本方案开始持久化 native id 之后，旧 native id 会让判重失效、
         回查错行。
      ④ 服务端发起的轮次（定时任务 / 看板任务阶段 / 子会话 / 命令会话）没有 turn_id 可
         采纳 —— 客户端根本没有传 turn_id 的入口（Stream.Send 只收 string）。
      ⑤ 同步把已存在的轮次又写一遍（用户报告「同步后丢失的更厉害了」的那一半）：
         ACP 只有 LoadSession、没有字节游标，Full 同步必然整段重放；而实时写入的行
         与导入重放出来的行同时躲过两道防线 —— 导入器把相邻同角色条目合并，Content
         逐字不同；ACP 的 SessionUpdate **不带时间戳**，导入行盖的是 time.Now()，
         与实时行的真实时间能差几小时，于是「内容 + ±5s」和 TimestampFloor 一起失效。
         实测 2026-10-07：live-owned 会话 1791339665-fb5134041392 Full 同步后多出
         9 对 live/import 重复行，另有 3 对 import+import（相隔 20s）。
      ⑥ ACP 导入丢 reasoning：importer 只收 UserMessageChunk / AgentMessageChunk，
         AgentThoughtChunk 整个被丢掉，于是「只思考不出话」的轮次导入后正文为空。
      ⑦ **S2d-2 之前的双写是两份真相**：块流与主日志 content 同时写着同一段正文，
         任何一处只被部分更新就会漂移（revision 版本、导入合并、fork 复制各有各的路径）。
         合并本轮起主日志 content 恒空，块流是唯一载体。
      ⑧ **user 行被空内容守卫整行吞掉**：S2d-2 一旦让 user 行不再带正文，
         addExchangeForAgentAt 里「空正文 + 非 agent 就跳过」的判据会把**每一行 user**
         丢掉 —— 前端表现为「我说过的话不见了」，且没有任何报错。
      ⑨ **assistant 分析块错挂到 user 行**：用 caller 的陈旧 Session 快照预测 assistant
         seq，而 Manager 锁内按最新状态分配了不同 seq；aux/blocks 写到前一条 user 行，
         重开后分析文本被当成用户消息展示。
    why: |
      1) 新增 sessions/<key>.blocks.jsonl（CUSTOM(G-BH) 的块流），一行一块：
         {seq,pos,revision,type,text|toolcall|todo|plan|compact,step,turn_id,native_id,
          parent_tool_use_id,task_id,subagent_type}。type ∈ {reasoning,text,tool_call,
         todo,plan,compact}。pos 取代旧 aux 的 line（line 是「在 content 里的第几行」，
         content 一删就失去意义）；同 (seq,pos) 多版本按 revision 取最高。
      2) Manager.AppendBlocks / ReadBlocks / GetBlocksWindow / blocksPath（blocks.go）：
         append-only JSONL，坏行跳过不报错（一行写坏不能让整个会话的正文读不出来）。
      3) Exchange 加轮次元数据：turn_id（MindFS 权威身份，落盘即定、永不改）、
         turn_seq（= 打开该轮的 user 行 seq）、native_turn / native_prompt（agent 侧
         回查键，可空、可后补、fork 后可变更）、partial（本轮未收尾）。
         用 session.WithExchangeIdentity 这个 context 值传递而不是给
         addExchangeForAgentAt 加参数：identity 是轮次级（同一轮的用户行与助手行必须带
         同一个 turn_id），而调用点已有 8 处。
      4) BuildTurnBlocks（blocks.go）把「一轮的正文 + aux」编译成块序列，顺序与前端
         buildAssistantTimeline 的既有渲染顺序**逐条一致**（aux 按 (line,到达序) 稳定排序
         后插进正文段之间、空正文段跳过）—— S2b 起块序就是渲染序，不一致就等于切换读
         路径时正文顺序会变（用户可见的回归）。放在 usecase 而不是 Manager.appendExchange
         里做：appendExchange 只看到一段字符串、appendExchangeAux 只看到一条 aux，
         两者都拼不出交错顺序。
      5) S2a 是**双写**：块流与旧 Content/aux 并存，读路径仍走旧格式，可整体回滚。
         写入点：persistUserTurnExchange（user 块）、SendMessage 轮末（助手块）、
         persistCommandTurn（命令块）、attachBackgroundSessionUpdates（子会话块）。
         块写失败不拖垮本轮（正文已由 AddExchangeForAgent 落过盘），只记日志。
      6) C2 服务端 mint turn_id：newTurnID() 拼 RFC4122 UUIDv4（不引 google/uuid，
         与 randomHex 同一条 crypto/rand 路径）。mint 点只有 persistUserTurnExchange
         一处 —— 三条服务端发起的轮次路径（scheduled/tasks.go 定时任务、
         appcontext.go 看板任务阶段、子会话）都经 SendMessage 走到它。
      7) C1 repoint 清 native id：Manager.ClearNativeIdentity 行级 JSON 手术删掉
         native_turn/native_prompt/native_id（**不是**结构体往返 —— 主日志里可能有别的
         写入者/未来版本加的字段，反序列化再序列化会把它们丢掉）。文件里本来没有 native id
         时**一个字节都不写**（无谓重写会改 mtime、白白让缓存失效，而落地前的全部历史数据
         都没有 native id）。清完删掉内存缓存与读盘游标：新文件更短时旧 offset 越过 EOF，
         增量读拿不到东西，带旧 native id 的那份缓存会一直留着。
      8) fork 复制历史时块流一起复制、seq 按 seqMap 重映射、native_id 清空；
         turn_id 原样带过去（fork 复制的是同一批轮次）、turn_seq 重映射。fork 开的是
         全新 agent 会话（AgentSessionID:"" + ForkPoint），源 native id 一律无效。
      9) 删会话时连块流一起删（否则正文留在盘上，会话 key 复用时被当成「本来就有正文」）。
      10) S2b 读路径改走块流（GetBlocksWindow，blocks.go）：窗口读**反向分块**读尾部 ——
          与 S1 的 readAuxWindowTail 同思路，但**不复用它**。那个实现丢掉每块的首个不完整行，
          跨越 512KB 边界的记录会静默丢失；块流一行可达 700KB（实测 os 单块 119714 字符），
          必须两阶段：先反向探测出停止偏移（只解析块内部的完整行），再 alignLineStart 对齐到
          行首后**一次正向读到 EOF**。代价是 2× IO，换来「窗口里永远不丢正文」。窗口读必须
          是 O(窗口)：m.mu 每 root 一把，「每轮都全量读一遍块流」会让长会话打开时把所有请求串起来。
      11) resolveBlocks 按 (seq,pos) 取最高 revision、跳过 step<0 的未收口块、按 (seq,pos) 排序。
          CompactBlockLight **只压工具卡细节**（复用 CompactToolCall + lightCompactToolCall），
          正文与 reasoning **一个字都不动** —— S1 的压缩是「工具卡按 seq 惰性取」，
          正文要是被压掉，这个方案就白做了。
      12) sessionResponse 回包内联 blocks（http.go），只带窗口内 seq（windowSeqsForExchanges）；
          与 exchange_aux 同一形状 {seq: [...]}。内联而不是让前端再发一次请求：窗口回包本来
          就是这一屏的**唯一**权威快照，多一次往返就多一个「正文还没到」的空窗。
      13) 前端按 type 渲染块（web/src/hooks/sessionBlocks.ts 新增；useSessionStream.ts 与
          SessionViewer.tsx 接线）：reasoning → thought（灰显/可折叠，复用既有渲染）、
          text → assistant_text、tool_call → tool、todo/plan/compact 各自成项，未知类型
          **跳过而不是抛错**（agent 加新类型时旧前端必须能活）。顺序**只按 pos 遍历** ——
          旧渲染器的 lines/totalLines/emittedLines/clamp 全部消失（那套是「把 aux 按 line
          插进 content 字符串」的产物，块流下无意义）。项 id 用 block:<seq>:<pos>：
          (seq,pos) 在一个会话里唯一且**跨 revision 稳定**，同一块被补正时 React 与虚拟列表的
          测量不重建（旧 id 含内容哈希，流式期每 chunk 换一次）。判定逻辑单独成 .ts 模块是因为
          .tsx 在 node --test 下导入不了（见 web/tests/ts-module-hook.mjs 的边界说明），
          住在 hook 里就只能靠源码文本断言。
      14) 块跟着 exchange_aux 走完**全部**缓存路径（services/session.ts + App.tsx）：
          toPersistentSession 只留还在 exchanges 里的 seq、withSessionMeta 与窗口锚定
          「按 seq 覆盖」、cloneSession 浅拷贝。漏掉任何一条都会让**首帧种子**退回旧格式 ——
          双写期看不出差别，S2d 删掉 content 之后就是「切会话正文闪一下」。覆盖而不是拼接：
          同一个 seq 的块集合是**完整快照**（后端已按 revision 归并），拼接会让旧 revision 与
          新 revision 并存、渲染成两段重复正文；而 aux 在同一 seq 下会陆续追加，所以 aux 必须
          拼接。两者形状相同、语义相反，是刻意的。
      15) S2c 身份判重（exchangeAlreadyRecorded）：写入侧按 native id 判重，判重顺序是
          「先身份、后内容」。有身份且库里对不上 → **一律落库**（那可能是一轮真新增的
          内容，丢掉才是 bug；方案 D10：永不猜）；有身份且匹配上 → 跳过；没有身份 →
          退回「内容归一化 + ±5s」，并按会话记一条「判重还在猜」的日志（可观测的退化指标）。
          实时路径只把 agent 真正返回的原生消息 id 写入 agent_id；MindFS turn id 不冒充
          agent 身份。ACP 回显 prompt turn id 时，仅按 user 行 mindfs_id 精确桥接，规则见 G-BI。
      16) 两端取身份必须同一口径：ACP 的行边界 = **消息边界**（规范原文「messageId 变化
          表示一条新消息开始」），实时路径取「最后一个带 messageId 的文本块」。合并规则
          不一致就永远对不上。claude importer 同理在合并后取最后一个 uuid。
      17) messageId 只认 UUID 形态（isUUIDShape）：ACP 规范要求两端都用 UUID 格式，而
          MindFS 递出去的就是自己 mint 的 turn_id；别的形态一律当「没有身份」，宁可不判重
          也不能拿一个对不上的字符串当身份。
      18) （历史状态，2026-10-12 退役，见 G-AB）投影曾按身份保护新行、按内容折叠旧重复，
          审计端点曾报告 identity_bearing_rows。实测仍有误折叠不同回合的可能；身份写入判重
          已接管新数据，本地历史数据完成一次性清理后，投影与审计端点一并删除。
      19) TimestampFloor 只给 HasTranscriptTimestamps 的导入器（claude/codex）。ACP 的
          SessionUpdate 不带时间戳，它给每行盖的是「读到它的那一刻」，恒晚于地板 ——
          地板形同虚设，而代码看着像「有地板就安全」。删掉那道假防线后，ACP 侧的正确性
          由 native id 身份判重负责。
      20) **S2d-2 块流成为正文唯一载体（D1）**：主日志一行的 content 恒空，正文只写块流。
          三个写入点全部收紧 —— persistUserTurnExchange（user 行）、SendMessage 轮末
          （助手行）、appendImportedExchange（导入行）。字段保留为 LegacyContent 且
          **json tag 仍叫 content**：老会话文件必须还能解析，而它现在的唯一读者是
          S2d-1 的回填（backfillTurnsFromWindow）。助手块的写入从「失败只记日志」改成
          **返回 err**：主日志那一行只剩元数据，块丢了就等于这一轮没有正文，而用户看得
          出来；导入路径仍只记日志（那一行已经落盘，块失败不该让整行消失）。
      21) addExchangeForAgentAt 的空行守卫跟着改：S2d-2 之前它按「空正文 + 非 agent 角色」
          跳过，而 user 行现在**恒空**，照旧判据会把每一行 user 静默丢掉（轮次元数据
          turn_id/native_prompt 跟着没，前端按 seq 合并时那句话不显示，搜索的 user 命中
          优先也失效）。改成「什么都没带」才算空行：空正文 + 空 agent + 无任何轮次身份。
      22) 判重的内容比对改读块流（recordedExchangeBody）：claude 的 user 行拿不到 native
          uuid，判重只能靠正文，而正文现在住在块流里。不读就会把同一个 prompt 反复当新行
          写下去 —— 那正是「ask 下面又渲染一轮出现过的文字」。
      23) 搜索改两遍（searchSessionContent）：先搜块流（text + reasoning），再扫主日志。
          块流那遍是新内容的主路径，主日志那遍为了**还没回填的老会话**（回填是读时惰性的，
          会话没被读过就还没块）。省掉任一遍都是静默失效。
      24) fork 分工明确：copyForkBlocks 复制**源已有的块**（revision/step 是盘上真值，
          不重编号），fillForkBlocksFromLegacy 给老会话补编译。两者都要 —— 只补编译会丢
          源块里的 revision 信息，只复制会让老会话 fork 出一份没有正文的会话。
      25) sessionSummary（appcontext.go）与 copyForkHistory 的主日志正文读取全部改走
          GetBlocksWindow —— 摘要标题、fork 复制都从块流取，否则新会话的标题是空的。
      26) Manager 新增 TurnIDForSeq：块要带 turn_id 才能挂回轮次，而 max+1 分配下
          「刚写下的那一行」的 seq 只有调用方算得出、turn_id 却存在行里（导入路径就是
          拿到 seq 之后回过头来问这一行的身份）。
      27) 追加 exchange 的真实 seq 只能由 Manager 在锁内分配。新接口返回这个 seq 并刷新
          caller snapshot；SendMessage、子会话与命令会话用返回值写 aux 和块流，不再从可能
          陈旧的 slice 计算 max+1。这样 reasoning/tool/plan 等块始终落在实际 assistant 行。
    boundary: |
      会话正文的存储、身份与读取：块流格式、块写入点、轮次元数据字段、turn_id 生成与清理、
      窗口读走块流、前端按 type 渲染块。
      S3 退役 seq=0 机制 —— 后续步骤，不在本组。
      本组内部 S2a（双写，读路径不动）、S2b（读路径切块流，content 退化为回退）、
      S2d-2（主日志 content 恒空，块流是唯一载体）、S2e（pending 灯的身份从单调代次
      换成 turn_id）是**四个可独立回滚的提交**：
      S2b 之后前端仍能渲染没有块流的历史会话，S2d-2 之后老会话靠 S2d-1 的回填补齐，
      S2e 只换 pending 身份的表示（uint64 → string），不碰任何落盘语义。
      主日志格式兼容：没有身份字段的历史行读成零值，不报错；content 字段保留为
      LegacyContent（json tag 不改名）以兼容存量文件与回填输入。
