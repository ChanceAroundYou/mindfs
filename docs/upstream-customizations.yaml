  - id: G-T
    title: 流式重放与正文正确性（快照重建协议）
    kind: fix
    symptom: |
      同一段正文在行内被拼成 aabb（「文本出现两遍、越切越多」）；
      每切一次会话就刷一大堆重放；首次打开运行中会话时内容逐渐刷出来；
      切回运行中会话时在途内容整块丢失；
      **正在完成的正文瞬间消失**（2026-10-06 真机复现：时间线 137 项/11970 字 → 2 项/1614 字，只剩已落盘的用户行）；
      控制台每个重放批帧抛一次 `onStream(undefined)` TypeError；
      没有用户操作也会每 8 秒自持一次 `done → session.ready → 重放 → done`（实测 18 次/秒）；
      瞬时行认领别人的工具卡（正文下方多出一整套工具卡）；seq=0 行跨 7 次 compact 堆积到 1100+ 条。
    why: |
      **重放是快照重建，不是增量续流**：服务端每次挂载恒回一帧 `reset:true` 的整批事件
      （`buildSessionStreamBatchResponse`），客户端清掉瞬时尾巴再照单重建，于是
      「客户端尾巴 = 服务端 buffer 的纯函数」无条件成立（首帧的 `first` 标志保证空 buffer 也发）。
      这一组在 2026-10-06 被**整体反转**过一次，合上游时切勿按旧版恢复：
      `event_cursor` 序号续传、客户端 `mergeStreamedText` 重发判据、服务端 `completed` 表补发
      `done(replay:true)` 三者**全部删除** —— 前两者在真实抓包里恒为空/恒为假（写游标的代码只认单条
      `payload.event`，而重放走批处理帧 `payload.events`），第三者是自持环的燃料。
      `reset` 必须是**参数**而不是常量：首帧（快照）与排空循环的续投帧（`replayStepToClient`）
      形状相同、语义相反，写成常量会让排空期间新到的事件清掉刚重建好的尾巴。
      瞬时行判据只能有**一处**实现（`isTransientExchange`），且 seq=0 的**用户行例外必须保留** ——
      它是客户端发出消息时的乐观回声，服务端事件流里从来没有它，照判据清尾巴会让刚发出去的消息当场消失。
    files:
